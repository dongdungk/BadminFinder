name: badminfinder
# 프로젝트 이름 (소문자, 언더스코어만 가능)

description: 배드민턴 체육시설 혼잡도 확인 앱

# ============================================
# Flutter SDK 버전
# ============================================
environment:
  sdk: '>=3.0.0 <4.0.0'
  # Dart 언어 버전 범위

# ============================================
# 의존성 패키지 (Dependencies)
# ============================================
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  firebase_core: ^3.8.1  # 이게 있어야 함
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  kakao_flutter_sdk_user: ^1.9.6
  cupertino_icons: ^1.0.2
  # iOS 스타일 아이콘 (기본 포함)

  # ------------------------------------------
  # 지금 단계에서는 위에 것만 있으면 됨!
  # 아래는 나중 단계를 위해 주석 처리
  # ------------------------------------------

  # 3단계(버튼 기능)에서 추가할 것:
  # provider: ^6.1.1
  # # 상태 관리 패키지
  
  # 4단계(API 연동)에서 추가할 것:
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.15.0
  # google_sign_in: ^6.1.6
  # kakao_flutter_sdk: ^1.7.0

# ============================================
# 개발용 패키지 (Dev Dependencies)
# ============================================
dev_dependencies:
  flutter_test:
    sdk: flutter
    # 테스트용 패키지 (기본 포함)

  flutter_lints: ^2.0.0
  # 코드 스타일 체크 (기본 포함)

# ============================================
# Flutter 설정
# ============================================
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    
    # 또는 파일 하나씩 지정:
    # - assets/images/google_logo.png
    # - assets/images/kakao_logo.png
    # - assets/images/naver_logo.png
    # - assets/images/map_illustration.png
    # - assets/images/court_illustration.png

  # ------------------------------------------
  # 폰트 설정 (나중에 필요하면)
  # ------------------------------------------
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: fonts/Pretendard-Regular.ttf
  #       - asset: fonts/Pretendard-Bold.ttf
  #         weight: 700